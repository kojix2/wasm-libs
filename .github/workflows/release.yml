name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build all libraries
        run: make clean all

      - name: Smoke check built archives
        run: |
          test -f wasm32-wasi-sysroot/lib/wasm32-wasi/libc.a
          test -f wasm32-wasi-sysroot/lib/wasm32-wasi/libclang_rt.builtins-wasm32.a
          test -f wasm32-wasi-sysroot/lib/wasm32-wasi/libpcre2-8.a
          test -f wasm32-wasi-sysroot/lib/wasm32-wasi/libgc.a

      - name: Create distribution archives
        run: make tar

      - name: Get version from tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            wasm32-wasi-sysroot.tar.gz
            wasm32-wasi-libs.tar.gz
          generate_release_notes: true

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: wasm32-wasi-${{ steps.version.outputs.version }}
          path: |
            wasm32-wasi-sysroot.tar.gz
            wasm32-wasi-libs.tar.gz
          retention-days: 30
